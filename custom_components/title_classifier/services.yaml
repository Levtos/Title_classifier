set_enum:
  fields:
    entry_id:
      required: true
      selector:
        text:
    key:
      required: true
      selector:
        text:
    enum:
      required: true
      selector:
        number:
          min: 0
          max: 9
          mode: box

delete_entry:
  fields:
    entry_id:
      required: true
      selector:
        text:
    key:
      required: true
      selector:
        text:

clear_old:
  fields:
    entry_id:
      required: false
      selector:
        text:
    days:
      required: false
      default: 30
      selector:
        number:
          min: 1
          mode: box

import_entries:
  fields:
    entry_id:
      required: true
      selector:
        text:
    entries:
      required: true
      selector:
        object:

import_local_storage:
  name: Lokale Daten importieren
  description: >-
    Importiert alte .storage-Einträge einmalig in den gemeinsamen Postgres-
    Katalog. Ziel ist entweder ein Watcher (entry_id) oder direkt scope +
    category. Quelle ist die eigene .storage oder ein beliebiger Storage-Key
    (z. B. etm_<id>). Idempotent; die Quelldatei wird nur gelesen.
  fields:
    entry_id:
      name: Ziel-Watcher
      description: >-
        entry_id des Watchers, in dessen scope/category importiert wird. Leer
        lassen und stattdessen scope + category angeben, um ohne Watcher zu
        importieren.
      required: false
      selector:
        text:
    scope:
      name: Scope
      description: Ziel-Scope, wenn kein entry_id angegeben ist (z. B. default).
      required: false
      selector:
        text:
    category:
      name: Kategorie
      description: Ziel-Kategorie, wenn kein entry_id angegeben ist.
      required: false
      selector:
        select:
          options:
            - music
            - game
            - tv
            - stash
    source_entry_id:
      name: Quell-entry_id
      description: >-
        Optional: entry_id der zu lesenden Title-Classifier-.storage. Leer = die
        eigene entry_id des Ziel-Watchers.
      required: false
      selector:
        text:
    source_storage_key:
      name: Quell-Storage-Key
      description: >-
        Optional: voller Storage-Key der zu lesenden Datei, z. B.
        etm_01KR3F6XQ7Q934CS343M3GVCAJ (für Daten der alten etm-Integration).
      required: false
      selector:
        text:
    dry_run:
      name: Probelauf
      description: Nur zählen, nichts schreiben.
      required: false
      default: false
      selector:
        boolean:
