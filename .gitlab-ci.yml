include:
  - project: "ha-platform/control"
    ref: main
    file: "/ci/hacs-github-release.gitlab-ci.yml"

variables:
  HACS_GITHUB_REPOSITORY: "Levtos/Title_classifier"
  HACS_MANIFEST_PATH: "custom_components/title_classifier/manifest.json"

stages:
  - test
  - release

backend_tests:
  stage: test
  image: python:3.12-slim
  timeout: 15 minutes
  script:
    - python -m pip install --disable-pip-version-check --no-cache-dir pytest
    - python -m pytest -q
    - python -m compileall -q custom_components tests
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

frontend_tests:
  stage: test
  image: node:22-bookworm-slim
  timeout: 15 minutes
  script:
    - cd frontend-src
    - npm ci --no-audit --no-fund
    - npm test -- --run
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
